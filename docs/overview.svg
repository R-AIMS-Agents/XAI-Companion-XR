<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title">
  <title id="title">The agent package holds the agent and its LiveKit connection; the Rocketbox Agent sample holds the avatar, the demo scene and optional scenarios; the LiveKit server links the client to the backend.</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; text-anchor: middle; }
    .name { font-size: 14px; font-weight: 600; }
    .part { font-size: 13px; }
    .sub { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; fill: #59636e; }
    .start { text-anchor: start; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .client { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
    .stage { fill: #ffffff; stroke: #54aeff; stroke-width: 1.5; }
    .repo { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .host { fill: none; stroke: #818b98; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .other { fill: #f6f8fa; stroke: #818b98; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .link { stroke: #818b98; stroke-width: 1.5; fill: none; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .sub, .label { fill: #9198a1; }
      .box { fill: #151b23; stroke: #3d444d; }
      .client { fill: #0d2a4f; stroke: #1f6feb; }
      .stage { fill: #0d1117; stroke: #1f6feb; }
      .repo { stroke: #4493f8; }
      .host { stroke: #9198a1; }
      .other { fill: #151b23; stroke: #9198a1; }
      .link { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="client" x="10" y="10" width="640" height="400" rx="8"/>
  <text class="name" x="330" y="32">Unity project (this repository)</text>

  <rect class="repo" x="20" y="42" width="620" height="244" rx="6"/>
  <text class="sub" x="330" y="62">Agent code: Packages/com.trivas.agent</text>

  <rect class="stage" x="32" y="74" width="380" height="200" rx="6"/>
  <text class="name" x="222" y="96">Agent</text>

  <rect class="box" x="288" y="110" width="112" height="88" rx="6"/>
  <text class="part" x="344" y="150">State</text>
  <text class="part" x="344" y="166">machine</text>

  <line class="link" x1="286" y1="154" x2="272" y2="154" marker-end="url(#arrow)"/>

  <rect class="box" x="166" y="110" width="104" height="88" rx="6"/>
  <text class="part" x="218" y="150">Behaviour</text>
  <text class="part" x="218" y="166">driver</text>

  <line class="link" x1="164" y1="128" x2="150" y2="128" marker-end="url(#arrow)"/>
  <line class="link" x1="164" y1="180" x2="150" y2="180" marker-end="url(#arrow)"/>

  <rect class="box" x="44" y="110" width="104" height="36" rx="6"/>
  <text class="part" x="96" y="133">Animation</text>

  <rect class="box" x="44" y="162" width="104" height="36" rx="6"/>
  <text class="part" x="96" y="185">Gaze</text>

  <rect class="box" x="44" y="222" width="104" height="36" rx="6"/>
  <text class="part" x="96" y="245">Blinking</text>

  <rect class="box" x="166" y="222" width="234" height="36" rx="6"/>
  <text class="part" x="283" y="245">Lip sync (uLipSync)</text>

  <rect class="stage" x="500" y="74" width="128" height="200" rx="6"/>
  <text class="name" x="564" y="150">Connection</text>
  <text class="sub" x="564" y="172">LiveKit room</text>
  <text class="sub" x="564" y="190">microphone, playback</text>
  <text class="sub" x="564" y="208">RTVI messages</text>
  <text class="sub" x="564" y="226">debug panel</text>

  <line class="link" x1="498" y1="136" x2="416" y2="136" marker-end="url(#arrow)"/>
  <text class="label" x="456" y="126">RTVI events</text>

  <line class="link" x1="498" y1="240" x2="416" y2="240" marker-end="url(#arrow)"/>
  <text class="label" x="456" y="230">agent audio</text>

  <rect class="host" x="20" y="310" width="620" height="90" rx="6"/>
  <text class="sub" x="330" y="330">Rocketbox Agent sample: Assets/Samples/TrIVA Agent</text>

  <rect class="box" x="32" y="342" width="190" height="46" rx="6"/>
  <text class="part" x="127" y="361">Avatar</text>
  <text class="sub" x="127" y="378">model, face rig profile, animator</text>

  <rect class="box" x="235" y="342" width="190" height="46" rx="6"/>
  <text class="part" x="330" y="361">Demo scene</text>
  <text class="sub" x="330" y="378">XR Origin, teleport floor</text>

  <rect class="box" x="438" y="342" width="190" height="46" rx="6"/>
  <text class="part" x="533" y="361">Scenarios</text>
  <text class="sub" x="533" y="378">optional, added next to it</text>

  <line class="link" x1="127" y1="276" x2="127" y2="340" marker-end="url(#arrow)"/>
  <text class="label start" x="134" y="302">drives</text>

  <line class="link" x1="533" y1="340" x2="533" y2="276" marker-end="url(#arrow)"/>
  <text class="label start" x="540" y="302">scenario events</text>

  <line class="link" x1="632" y1="174" x2="746" y2="174" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="700" y="164">audio and data</text>

  <rect class="box" x="750" y="142" width="140" height="64" rx="8"/>
  <text class="name" x="820" y="169">LiveKit server</text>
  <text class="sub" x="820" y="189">to the backend</text>

  <line class="link dashed" x1="642" y1="262" x2="746" y2="262" marker-end="url(#arrow)"/>
  <text class="label" x="694" y="252">as a package</text>

  <rect class="other" x="750" y="230" width="140" height="64" rx="8"/>
  <text class="name" x="820" y="257">Other Unity project</text>
  <text class="sub" x="820" y="277">optional</text>
</svg>
